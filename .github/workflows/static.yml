# Workflow for building and deploying a Flutter web app to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: True

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Set up the Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.0'

      # 2. Fetch project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 3. Build the Flutter web app with the correct base-href
      - name: Build Flutter web
        run: flutter build web --base-href "/Running_Sum_of_1D_Array/"

      # 4. Verify we are publishing the Flutter web app artifact only
      - name: Verify Flutter web artifact
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          if [ -f build/web/README.md ]; then
            echo "Unexpected README.md found in deploy artifact; expected Flutter web output only."
            exit 1
          fi
          touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This will now successfully find the folder generated in Step 3
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
